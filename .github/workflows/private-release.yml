name: RuijieBot evaluation release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.1.74；已存在的版本不会覆盖"
        type: string
        required: true
        default: "v0.1.74"
      source_ref:
        description: "可选：本仓库包含此工作流的分支或提交；留空使用所选分支"
        type: string
        required: false
      release_mode:
        description: "产物去向：draft 草稿，prerelease 公开测试版，artifacts 仅下载包"
        type: choice
        default: draft
        options: [draft, prerelease, artifacts]

permissions:
  contents: read

concurrency:
  group: private-evaluation-${{ inputs.version }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  OMB_EXPECTED_UPDATE_OWNER: rj-liukaiwen
  OMB_EXPECTED_UPDATE_REPO: OpenMausBot
  OMB_EXPECTED_DESKTOP_NAME: 锐捷Bot

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Pin one versioned build commit for every platform
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-private-release.mjs

  desktop:
    name: ${{ matrix.platform }} x64
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            resources: release/win-unpacked/resources
          - platform: linux
            os: ubuntu-24.04
            resources: release/linux-unpacked/resources
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Linux package and smoke tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Check types and package configuration
        run: |
          pnpm typecheck
          node --test --test-isolation=none electron/private-release.node-test.mjs electron/ruijie-package-config.node-test.mjs electron/desktop-runtime-layout.node-test.mjs
          pnpm exec vitest run server/browser-engine.test.ts server/browser-navigation.test.ts server/browser-live.test.ts server/browser-runtime.test.ts server/local-computer-proxy-gate.test.ts server/local-computer-proxy.test.ts
          pnpm test:packaged-server
      - name: Fetch the pinned Windows browser vendor
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          node scripts/fetch-evaluation-browser-vendor.mjs
          "OMB_BROWSER_VENDOR_DIR=$((Resolve-Path dist-native/browser-vendor).Path)" >> $env:GITHUB_ENV
      - name: Prepare compiled app and native resources
        run: pnpm package:prepare
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm build:cua:windows
          pnpm build:feishu:windows
          node scripts/desktop-build-receipt.mjs --write
          pnpm exec electron-builder --config electron-builder.testing.mjs --win --x64 --publish never
      - name: Confirm unsigned Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = "release/RuijieBot-${{ needs.prepare.outputs.version }}-setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected installer signing status: $($signature.Status)" }
          Write-Output 'Windows installer: unsigned, as requested.'
      - name: Package Linux and exercise native input
        if: matrix.platform == 'linux'
        run: |
          pnpm build:cua:linux
          node scripts/desktop-build-receipt.mjs --write
          dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
          pnpm exec electron-builder --config electron-builder.testing.mjs --linux --x64 --publish never
          node scripts/verify-linux-package.mjs
      - name: Check packaged resources and public destination
        run: node scripts/check-private-package.mjs '${{ matrix.resources }}'
      - name: Verify Linux installation and upgrade in the ephemeral runner
        if: matrix.platform == 'linux'
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo 'Unexpected /opt permissions'; exit 1 ;;
          esac
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          node scripts/smoke-browser-bundle.mjs --resources /opt/OpenMausBot/resources
          OMB_SMOKE_DIST=/opt/OpenMausBot/resources/server node scripts/smoke-packaged-server.mjs --browser-bundle /opt/OpenMausBot/resources/browser-engine
          OMB_KEEP_SMOKE_DIR=1 OMB_SMOKE_INSTALLED_DEB=1 pnpm smoke:linux-package
      - name: Verify Windows browser and packaged server in isolated fixtures
        if: matrix.platform == 'windows'
        run: |
          node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
          OMB_SMOKE_DIST="${{ github.workspace }}/release/win-unpacked/resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify bundled Windows Feishu runtime without account authorization
        if: matrix.platform == 'windows'
        run: node scripts/smoke-feishu-package.mjs "${{ github.workspace }}/release/win-unpacked/resources"
      - name: Validate artifacts and generate checksums
        run: node scripts/private-release-assets.mjs '${{ matrix.platform }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruijiebot-${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}-x64
          path: release/private-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove ephemeral Linux installation
        if: always() && matrix.platform == 'linux'
        run: sudo dpkg --purge openmausbot || true

  macos:
    name: macOS Universal · ad-hoc signing
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - name: Check types and package configuration
        run: |
          pnpm typecheck
          node --test --test-isolation=none electron/private-release.node-test.mjs electron/ruijie-package-config.node-test.mjs electron/desktop-runtime-layout.node-test.mjs
          pnpm exec vitest run server/local-computer-proxy-gate.test.ts server/local-computer-proxy.test.ts
          pnpm test:packaged-server
      - name: Build both native input slices
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:cua
          pnpm build:feishu:mac
          node scripts/desktop-build-receipt.mjs --write
          pnpm exec electron-builder --config electron-builder.testing.mjs --mac dir --arm64 --x64 --publish never
      - name: Merge Universal app, sign every native component, package and verify final DMG
        run: node scripts/package-private-macos.mjs
      - name: Verify Apple Silicon browser and packaged server
        run: |
          app="$PWD/release/mac-universal/OpenMausBot.app"
          res="$app/Contents/Resources"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/OpenMausBot" -e 'if (process.arch !== "arm64") process.exit(1); console.log("Packaged Electron ARM runtime started")'
          node scripts/check-private-package.mjs "$res"
          node scripts/smoke-feishu-package.mjs "$res"
          node scripts/smoke-browser-bundle.mjs --resources "$res"
          OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$res/browser-engine"
      - run: node scripts/private-release-assets.mjs macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruijiebot-${{ needs.prepare.outputs.tag }}-macos-universal
          path: release/private-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos-intel:
    name: macOS Universal · Intel verification
    needs: [prepare, macos]
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: test "$(uname -m)" = x86_64
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruijiebot-${{ needs.prepare.outputs.tag }}-macos-universal
          path: mac-artifacts
      - name: Verify the same Universal ZIP on Intel
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          ditto -xk "mac-artifacts/RuijieBot-$RELEASE_VERSION-mac-universal.zip" "$RUNNER_TEMP/mac-test"
          app="$RUNNER_TEMP/mac-test/OpenMausBot.app"
          res="$app/Contents/Resources"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/OpenMausBot" -e 'if (process.arch !== "x64") process.exit(1); console.log("Packaged Electron Intel runtime started")'
          node scripts/private-macos-sign.mjs "$app" "$RUNNER_TEMP/mac-intel-signatures.json"
          node scripts/check-private-package.mjs "$res"
          node scripts/smoke-feishu-package.mjs "$res"
          node scripts/smoke-browser-bundle.mjs --resources "$res"
          OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$res/browser-engine"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("macos-intel-verification.json", JSON.stringify({version:process.env.RELEASE_VERSION,sourceSha:process.env.RELEASE_SHA,arch:process.arch,result:"passed",humanTccAcceptance:"not-run"},null,2));'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruijiebot-${{ needs.prepare.outputs.tag }}-macos-intel-verification
          path: macos-intel-verification.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Assemble verified evaluation release
    needs: [prepare, desktop, macos, macos-intel]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ruijiebot-${{ needs.prepare.outputs.tag }}-*
          merge-multiple: true
          path: release-assets
      - name: Verify every artifact and publish only the selected evaluation release type
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: node scripts/publish-private-release.mjs
